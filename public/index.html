<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f3ef" />
    <meta
      name="description"
      content="Maison+ : une démo interactive de votre maison connectée. Lumières, volets, climat et énergie dans une interface familière."
    />
    <title>Maison+ — Votre maison, simplement.</title>
    <link rel="stylesheet" href="style.css?v=4" />
    <link rel="stylesheet" href="menu.css?v=4" />
    <link rel="stylesheet" href="home.css?v=4" />
    <link rel="stylesheet" href="climate.css?v=4" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="#maison"
          ><span class="brand-icon" data-icon="home"></span>Maison<span
            class="plus"
            >+</span
          ></a
        >
        <div class="house-label">
          <span class="home-avatar" data-icon="home"></span>
          <div>Chez vous<small>Maison de démonstration</small></div>
          <span class="chevron">⌄</span>
        </div>
        <nav id="navigation" aria-label="Navigation principale"></nav>
        <div class="sidebar-bottom">
          <div class="connection"><i></i> Mode démo <span>Local</span></div>
          <button class="settings" onclick="settings()">
            <span data-icon="settings"></span> Réglages <span>⌘</span>
          </button>
          <div class="profile">
            <span class="avatar">M</span>
            <div>Ma maison<small>Tout commence ici.</small></div>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span id="breadcrumb">Ma maison <b>/</b> Vue d’ensemble</span>
          <div>
            <span class="demo-dot"></span><span>Démo interactive</span
            ><button
              class="icon-button"
              aria-label="Réglages"
              onclick="settings()"
              data-icon="settings"
            ></button>
          </div>
        </header>
        <main id="main"></main>
        <footer>
          Maison+ <span>Votre maison, simplement.</span
          ><span class="footer-right"
            >Données simulées · Aucun appareil connecté</span
          >
        </footer>
      </div>
    </div>
    <nav id="mobile-nav" aria-label="Navigation mobile"></nav>
    <dialog id="dialog" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <input type="file" id="import-file" accept="application/json" hidden />
    <script src="climate.js?v=4"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
